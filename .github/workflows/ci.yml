name: 🫆 CI PhoneINTEL (v1.1-alpha)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-security:
    name: 🛡️ Qualité, Typage & Sécurité (Ruff · Mypy · Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install lint & security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Type check with Mypy
        run: mypy src/ tests/

      - name: Security static analysis with Bandit
        run: bandit -r src/ -ll

  test:
    name: 🧪 Tests Pytest & CLI (Python ${{ matrix.python-version }})
    needs: lint-security
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        os: [ ubuntu-latest ]
        include:
          - python-version: "3.9"
            os: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
          pip check

      - name: Run unit & security tests with Pytest
        run: python -m pytest -v --cov=src --cov-report=term-missing

      - name: Smoke test CLI & JSON output
        run: |
          # 1. Analyse valide + JSON + masquage RGPD
          OUT="$(python src/phoneintel.py --info +33612345678 --mask --json)"
          echo "$OUT"
          python -c 'import json, sys; d = json.loads(sys.argv[1]); assert d["region_code"] == "FR" and "*" in d["e164"]' "$OUT"

          # 2. Génération Dorks JSON
          DORKS="$(python src/phoneintel.py --dorks +33612345678 --type social_networks --engine duckduckgo --json)"
          python -c 'import json, sys; d = json.loads(sys.argv[1]); assert "duckduckgo.com" in d["social_networks"]' "$DORKS"

          # 3. Rejet strict d'une entrée invalide
          if python src/phoneintel.py "invalid123" 2>/dev/null; then
            echo "❌ ÉCHEC : un numéro invalide aurait dû retourner un code d'erreur."
            exit 1
          fi
          echo "✅ Smoke tests CLI validés."

      - name: Publish CI Summary
        if: always() && matrix.python-version == '3.12'
        run: |
          {
            echo "## 🫆 PhoneINTEL CI Summary"
            echo "- **Dépendances :** \`requirements.txt\` + \`requirements-dev.txt\` + \`pyproject.toml\` ✅"
            echo "- **Lint & SAST :** Ruff, Mypy & Bandit ✅"
            echo "- **Matrice Python :** \`3.9\` (ubuntu-24.04), \`3.10\`, \`3.11\`, \`3.12\`, \`3.13\` ✅"
            echo "- **Tests :** Pytest + Couverture + Smoke tests CLI/JSON/RGPD ✅"
          } >> "$GITHUB_STEP_SUMMARY"

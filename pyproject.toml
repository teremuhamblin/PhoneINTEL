[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phoneintel"
version = "1.1.0a0"
description = "Outil OSINT téléphonique léger en ligne de commande"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
dependencies = [
    "phonenumbers>=8.13.0,<9.0.0",
]

[project.scripts]
phoneintel = "src.phoneintel:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phoneintel"
version = "1.1.0a0"
description = "Outil OSINT téléphonique léger en ligne de commande"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
dependencies = [
    "phonenumbers>=8.13.50,<10.0.0",
    "requests>=2.33.0,<3.0.0; python_version >= '3.10'",
    "requests>=2.32.4,<2.33.0; python_version == '3.9'",
    "requests>=2.32.3,<2.32.4; python_version < '3.9'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0; python_version >= '3.10'",
    "pytest>=8.0.0,<9.0.0; python_version == '3.9'",
    "pytest>=7.4.0,<8.4.0; python_version < '3.9'",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.11.0,<3.0.0; python_version >= '3.10'",
    "mypy>=1.11.0,<2.0.0; python_version < '3.10'",
    "types-requests>=2.32.0,<3.0.0",
    "bandit>=1.7.9,<2.0.0",
]

[project.scripts]
phoneintel = "src.phoneintel:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = true
